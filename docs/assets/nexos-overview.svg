<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="740" viewBox="0 0 1600 740" role="img" aria-labelledby="title description">
    <title id="title">The product we are building</title><desc id="description">NEXOS is a planned Ubuntu based distribution with a native Qt desktop, Python agent engine and Ollama, packaged as bootable ISO media.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
      <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
    </defs>
    <rect x="0" y="0" width="1600" height="740" rx="0" fill="#F4F7FA" stroke="#F4F7FA" stroke-width="2"/>
    <text x="64" y="54" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start"><tspan x="64" dy="0">NEXOS  /  ARCHITECTURE BLUEPRINT</tspan></text>
    <text x="64" y="108" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="650" text-anchor="start"><tspan x="64" dy="0">The product we are building</tspan></text>
    <text x="64" y="147" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Linux supplies the operating system foundation. NEXOS supplies the controlled AI workflow.</tspan></text>
    <rect x="64" y="193" width="1472" height="464" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="104" y="294" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="80" font-weight="700" text-anchor="start"><tspan x="104" dy="0">NEXOS</tspan></text><text x="108" y="350" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="500" text-anchor="start"><tspan x="108" dy="0">An AI assisted Linux desktop</tspan><tspan x="108" dy="44">for tasks with verified outcomes.</tspan></text><text x="108" y="465" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start"><tspan x="108" dy="0">Native interface. Local engine. Controlled tools.</tspan><tspan x="108" dy="31">An Ubuntu foundation packaged as a bootable ISO.</tspan></text><rect x="108" y="536" width="550" height="65" rx="10" fill="#122D42" stroke="#122D42" stroke-width="2"/><text x="383" y="577" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" text-anchor="middle"><tspan x="383" dy="0">Request  &gt;  Plan  &gt;  Execute  &gt;  Verify</tspan></text><rect x="830" y="233" width="654" height="111" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="854" y="271" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="854" dy="0">01  Native desktop</tspan></text><text x="854" y="306" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="854" dy="0">Qt / PySide6 / QML and Linux session integration</tspan></text><rect x="830" y="368" width="654" height="111" rx="14" fill="#E7F0F6" stroke="#CAD7E1" stroke-width="2"/><text x="854" y="406" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="854" dy="0">02  Agent execution layer</tspan></text><text x="854" y="441" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="854" dy="0">Python engine, Ollama, permissions and task evidence</tspan></text><rect x="830" y="503" width="654" height="111" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="854" y="541" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="854" dy="0">03  Distribution delivery</tspan></text><text x="854" y="576" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="854" dy="0">Required ISO; offline demo and optional VM export</tspan></text>
    <text x="64" y="713" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Planned design  |  18 October 2026  |  Diagram describes the target system</tspan></text>
  </svg>
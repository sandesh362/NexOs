<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="915" viewBox="0 0 1600 915" role="img" aria-labelledby="title description">
    <title id="title">From a request to verified work</title><desc id="description">Eight steps run from understand, plan, validate and authorize, through execution, independent verification, durable records and the user report. Retries and cancellation remain bounded.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
      <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
    </defs>
    <rect x="0" y="0" width="1600" height="915" rx="0" fill="#F4F7FA" stroke="#F4F7FA" stroke-width="2"/>
    <text x="64" y="54" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start"><tspan x="64" dy="0">NEXOS  /  ARCHITECTURE BLUEPRINT</tspan></text>
    <text x="64" y="108" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="650" text-anchor="start"><tspan x="64" dy="0">From a request to verified work</tspan></text>
    <text x="64" y="147" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Sensitive operations require an exact action grant. Task success requires independent evidence.</tspan></text>
    <rect x="64" y="220" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="88" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="88" dy="0">01  Understand</tspan></text><text x="88" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="88" dy="0">Capture outcome and scope</tspan><tspan x="88" dy="26">Resolve required parameters</tspan></text><rect x="452" y="220" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="476" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="476" dy="0">02  Plan</tspan></text><text x="476" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="476" dy="0">Build a typed dependency graph</tspan><tspan x="476" dy="26">Use registered tool contracts</tspan></text><rect x="840" y="220" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="864" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="864" dy="0">03  Validate</tspan></text><text x="864" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="864" dy="0">Check schema, targets and budget</tspan><tspan x="864" dy="26">Reject unsafe or unknown tools</tspan></text><rect x="1228" y="220" width="308" height="170" rx="14" fill="#E2F0EC" stroke="#CAD7E1" stroke-width="2"/><text x="1252" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="1252" dy="0">04  Authorize</tspan></text><text x="1252" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="1252" dy="0">Check scope and live capabilities</tspan><tspan x="1252" dy="26">Preview sensitive actions</tspan></text><polyline points="372,305 452,305" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="760,305 840,305" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="1148,305 1228,305" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="64" y="510" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="88" y="548" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="88" dy="0">08  Report</tspan></text><text x="88" y="583" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="88" dy="0">Return verified outcomes</tspan><tspan x="88" dy="26">State partial or failed work</tspan></text><rect x="452" y="510" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="476" y="548" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="476" dy="0">07  Record</tspan></text><text x="476" y="583" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="476" dy="0">Persist evidence and task state</tspan><tspan x="476" dy="26">Retain memory with provenance</tspan></text><rect x="840" y="510" width="308" height="170" rx="14" fill="#E7F0F6" stroke="#CAD7E1" stroke-width="2"/><text x="864" y="548" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="864" dy="0">06  Verify</tspan></text><text x="864" y="583" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="864" dy="0">Observe the real postcondition</tspan><tspan x="864" dy="26">A claim is not proof</tspan></text><rect x="1228" y="510" width="308" height="170" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="1252" y="548" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="1252" dy="0">05  Execute</tspan></text><text x="1252" y="583" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="1252" dy="0">Schedule and lock resources</tspan><tspan x="1252" dy="26">Use scoped adapters</tspan></text><polyline points="1382,390 1382,510" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="1228,595 1148,595" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="840,595 760,595" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="452,595 372,595" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="64" y="743" width="1472" height="100" rx="14" fill="#122D42" stroke="#122D42" stroke-width="2"/><text x="96" y="783" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="96" dy="0">Failure handling is part of the workflow</tspan></text><text x="96" y="819" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="96" dy="0">Bound retries, checkpoint before writes, reconcile uncertain effects and stop safely on cancellation.</tspan></text>
    <text x="64" y="888" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Planned design  |  18 October 2026  |  Diagram describes the target system</tspan></text>
  </svg>
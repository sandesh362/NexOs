<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title description">
    <title id="title">Runtime architecture inside NEXOS</title><desc id="description">The native desktop communicates with nexosd over a private socket. Every action passes a permission broker before local tools or remote connectors. Model inference has no authority. A verifier records observable outcomes.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
      <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
    </defs>
    <rect x="0" y="0" width="1600" height="1080" rx="0" fill="#F4F7FA" stroke="#F4F7FA" stroke-width="2"/>
    <text x="64" y="54" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start"><tspan x="64" dy="0">NEXOS  /  ARCHITECTURE BLUEPRINT</tspan></text>
    <text x="64" y="108" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Runtime architecture inside NEXOS</tspan></text>
    <text x="64" y="147" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">A native desktop and user daemon coordinate tools; Ollama provides model inference.</tspan></text>
    <rect x="48" y="178" width="1504" height="824" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="80" y="213" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start"><tspan x="80" dy="0">NEXOS GUEST OPERATING SYSTEM  /  installed VM or native Linux</tspan></text><rect x="80" y="245" width="360" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="104" y="283" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="104" dy="0">Native desktop and CLI</tspan></text><text x="104" y="318" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="104" dy="0">Request, plan, approvals</tspan><tspan x="104" dy="28">Progress, history and evidence</tspan></text><rect x="530" y="245" width="580" height="132" rx="14" fill="#E7F0F6" stroke="#CAD7E1" stroke-width="2"/><text x="554" y="283" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="554" dy="0">nexosd user service</tspan></text><text x="554" y="318" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="554" dy="0">Intent, typed plans and durable task graph</tspan><tspan x="554" dy="28">Specialist roles, scheduler and recovery</tspan></text><rect x="1200" y="245" width="320" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="1224" y="283" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="1224" dy="0">Ollama service</tspan></text><text x="1224" y="318" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1224" dy="0">One selected local model</tspan><tspan x="1224" dy="28">Inference only</tspan></text><rect x="80" y="490" width="360" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="104" y="528" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="104" dy="0">SQLite and memory</tspan></text><text x="104" y="563" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="104" dy="0">Task state and provenance</tspan><tspan x="104" dy="28">Records, indexes and artifacts</tspan></text><rect x="530" y="490" width="580" height="132" rx="14" fill="#E2F0EC" stroke="#CAD7E1" stroke-width="2"/><text x="554" y="528" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="554" dy="0">Permission broker</tspan></text><text x="554" y="563" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="554" dy="0">Tool schema, resource scope and action grant</tspan><tspan x="554" dy="28">No model output can grant authority</tspan></text><rect x="1200" y="490" width="320" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="1224" y="528" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="1224" dy="0">Desktop keyring</tspan></text><text x="1224" y="563" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1224" dy="0">OAuth and provider secrets</tspan><tspan x="1224" dy="28">No credentials in prompts</tspan></text><rect x="80" y="745" width="360" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="104" y="783" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="104" dy="0">Sandboxed local tools</tspan></text><text x="104" y="818" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="104" dy="0">Granted files and diagnostics</tspan><tspan x="104" dy="28">No default network or root</tspan></text><rect x="530" y="745" width="580" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="554" y="783" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="554" dy="0">Deterministic connectors</tspan></text><text x="554" y="818" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="554" dy="0">Approved API operations and reconciliation</tspan><tspan x="554" dy="28">Google Calendar and Meet after the core</tspan></text><rect x="1200" y="745" width="320" height="132" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="1224" y="783" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="1224" dy="0">Verifier and audit</tspan></text><text x="1224" y="818" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1224" dy="0">Observed postconditions</tspan><tspan x="1224" dy="28">Evidence before success</tspan></text><polyline points="440,310 530,310" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="485" y="292" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle"><tspan x="485" dy="0">IPC</tspan></text><polyline points="1110,310 1200,310" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="1155" y="292" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="middle"><tspan x="1155" dy="0">Local API</tspan></text><polyline points="820,377 820,490" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><text x="838" y="437" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="838" dy="0">Every action</tspan></text><polyline points="580,377 580,431 260,431 260,490" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><polyline points="650,622 650,685 260,685 260,745" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="820,622 820,745" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="1360,622 1360,681 1030,681 1030,745" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7" marker-end="url(#arrow)" /><polyline points="1110,811 1200,811" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="260,877 260,938 1360,938 1360,877" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><text x="300" y="928" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="300" dy="0">Tool results are checked independently; verification is recorded in the task journal.</tspan></text><text x="80" y="982" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start"><tspan x="80" dy="0">Separate privileges for inference, local tools and external credentials. Optional cloud inference requires user choice.</tspan></text>
    <text x="64" y="1053" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Planned design  |  18 October 2026  |  Diagram describes the target system</tspan></text>
  </svg>
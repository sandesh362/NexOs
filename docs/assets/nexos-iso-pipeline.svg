<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="885" viewBox="0 0 1600 885" role="img" aria-labelledby="title description">
    <title id="title">Build and deliver a bootable distribution</title><desc id="description">The release pipeline verifies the Ubuntu base, packages NEXOS, customizes the filesystem, assembles the bootable ISO, tests live and installed boot paths, and produces checksums and release evidence.</desc>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
      <marker id="arrowStart" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1D5678" stroke-width="1.5"/></marker>
    </defs>
    <rect x="0" y="0" width="1600" height="885" rx="0" fill="#F4F7FA" stroke="#F4F7FA" stroke-width="2"/>
    <text x="64" y="54" fill="#1D5678" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="start"><tspan x="64" dy="0">NEXOS  /  ARCHITECTURE BLUEPRINT</tspan></text>
    <text x="64" y="108" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="650" text-anchor="start"><tspan x="64" dy="0">Build and deliver a bootable distribution</tspan></text>
    <text x="64" y="147" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Build application packages first. Integrate the same packages into the required ISO release.</tspan></text>
    <rect x="64" y="220" width="420" height="152" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="88" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="88" dy="0">01  Verified Ubuntu base</tspan></text><text x="88" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="88" dy="0">Exact Desktop ISO and checksum</tspan><tspan x="88" dy="28">Inherited kernel, boot assets and installer</tspan></text><rect x="590" y="220" width="420" height="152" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="614" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="614" dy="0">02  NEXOS packages</tspan></text><text x="614" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="614" dy="0">Engine, Qt interface and integration</tspan><tspan x="614" dy="28">Versioned inputs and dependency lists</tspan></text><rect x="1116" y="220" width="420" height="152" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="1140" y="258" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="1140" dy="0">03  Customize live image</tspan></text><text x="1140" y="293" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1140" dy="0">Cubic on an Ubuntu builder</tspan><tspan x="1140" dy="28">Overlays, services and first run setup</tspan></text><polyline points="484,296 590,296" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="1010,296 1116,296" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="1326,372 1326,477" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="1116" y="477" width="420" height="152" rx="14" fill="#E7F0F6" stroke="#CAD7E1" stroke-width="2"/><text x="1140" y="515" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="1140" dy="0">04  Assemble bootable ISO</tspan></text><text x="1140" y="550" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="1140" dy="0">SquashFS and ISO tooling</tspan><tspan x="1140" dy="28">Model choice: setup or bundled demo</tspan></text><rect x="590" y="477" width="420" height="152" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="614" y="515" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="614" dy="0">05  Test both boot paths</tspan></text><text x="614" y="550" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="614" dy="0">Live session and clean installation</tspan><tspan x="614" dy="28">Eject ISO, reboot and check persistence</tspan></text><rect x="64" y="477" width="420" height="152" rx="14" fill="#E2F0EC" stroke="#CAD7E1" stroke-width="2"/><text x="88" y="515" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="650" text-anchor="start"><tspan x="88" dy="0">06  Release evidence</tspan></text><text x="88" y="550" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start"><tspan x="88" dy="0">ISO, SHA256 and version manifests</tspan><tspan x="88" dy="28">Optional sanitized prebuilt VM export</tspan></text><polyline points="1116,553 1010,553" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><polyline points="590,553 484,553" fill="none" stroke="#1D5678" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)" /><rect x="64" y="695" width="1472" height="116" rx="14" fill="#FFFFFF" stroke="#CAD7E1" stroke-width="2"/><text x="96" y="738" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="96" dy="0">Core ISO</tspan></text><text x="96" y="774" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="96" dy="0">Includes Ollama runtime; selects or downloads a model during setup.</tspan></text><text x="855" y="738" fill="#162B3D" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="650" text-anchor="start"><tspan x="855" dy="0">Offline demo ISO</tspan></text><text x="855" y="774" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start"><tspan x="855" dy="0">Includes one tested model and local fixtures.</tspan></text>
    <text x="64" y="858" fill="#4C6375" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start"><tspan x="64" dy="0">Planned design  |  18 October 2026  |  Diagram describes the target system</tspan></text>
  </svg>